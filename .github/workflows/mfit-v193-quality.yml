name: MFit v194 Part C quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - restructure/part-c-navigation-v194
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and test syntax
        run: |
          set -e
          for file in *.js tests/*.cjs; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run all non-browser tests
        run: |
          set -e
          for file in tests/*.cjs; do
            if [ "$file" != "tests/mfit-smoke.cjs" ]; then
              echo "Running $file"
              node "$file"
            fi
          done
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: node tests/mfit-smoke.cjs
      - name: Upload Part B screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfit-v194-part-c-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
